<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Local Service Finder</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <header> 
        <div class="container"> 
            <h1>Local Service Finder</h1> 
            <p>Find trusted service providers near you</p> 
        </div> 
    </header> 
 
    <main class="container"> 
        <section class="search-section"> 
            <div class="search-box"> 
                <input type="text" id="searchInput" placeholder="Search for services..."> 
                <select id="categoryFilter"> 
                    <option value="all">All Services</option> 
                    <option value="electrician">Electrician</option> 
                    <option value="plumber">Plumber</option> 
                    <option value="mechanic">Mechanic</option> 
                </select> 
            </div> 
        </section> 
 
        <section class="services-section"> 
            <h2>Available Service Providers</h2> 
            <div id="servicesList" class="services-grid"> 
                <!-- Services will be loaded here by JavaScript --> 
            </div> 
        </section> 
 
        <section class="map-section"> 
            <h2>Service Locations</h2> 
            <div id="map" class="map-container"> 
                <p>Map will be displayed here</p> 
            </div> 
        </section> 
    </main> 
 
    <footer> 
        <div class="container"> 
            <p>&copy; 2026 Local Service Finder - Servicefind.lk</p> 
        </div> 
    </footer> 
 
    <script src="js/app.js"></script> 
</body> 
</html>
